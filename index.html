<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Periwinkle E-Bike Calculator</title>
    
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --primary: #f1c40f;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #e67e22;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }
        .container {
            background-color: #34495e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            border-top: 5px solid var(--primary);
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
            font-size: 24px;
            text-transform: uppercase;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #bdc3c7;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }
        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border-radius: 10px;
            border: 2px solid #bdc3c7;
            box-sizing: border-box;
            margin-bottom: 15px;
            background-color: var(--light);
            color: var(--dark);
        }
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .battery-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .battery-body {
            width: 120px;
            height: 50px;
            border: 4px solid white;
            border-radius: 8px;
            padding: 3px;
            position: relative;
        }
        .battery-body::after {
            content: '';
            position: absolute;
            right: -12px;
            top: 12px;
            width: 8px;
            height: 20px;
            background: white;
            border-radius: 0 4px 4px 0;
        }
        .battery-fill {
            height: 100%;
            background-color: var(--success);
            border-radius: 4px;
            width: 100%;
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2c3e50;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #7f8c8d;
        }
        .toggle-label { font-size: 14px; font-weight: bold; }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #7f8c8d; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(26px); }

        .results {
            background-color: var(--light);
            color: var(--dark);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #bdc3c7;
            padding-bottom: 10px;
        }
        .result-item:last-child { border-bottom: none; padding-bottom: 0; }
        .result-label { font-weight: 600; font-size: 14px; }
        .result-data { font-size: 18px; font-weight: bold; color: var(--danger); text-align: right; }
        
        /* Highlight the Timer Result */
        .timer-highlight {
            color: var(--success) !important; 
            font-size: 24px !important; 
            background: rgba(46, 204, 113, 0.2);
            padding: 5px 10px;
            border-radius: 5px;
        }

        .note {
            font-size: 12px;
            color: #f1c40f;
            text-align: center;
            margin-top: 20px;
            line-height: 1.4;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>E-Bike Calculator</h1>
    <div class="subtitle">Periwinkle 60V 20Ah</div>

    <label for="voltageInput">Type Remaining Volts:</label>
    <input type="number" id="voltageInput" step="0.1" min="50.0" max="70.0" value="66.5" placeholder="e.g., 62.4">

    <div class="battery-container">
        <div class="battery-body">
            <div class="battery-fill" id="batteryFill"></div>
        </div>
    </div>

    <div class="toggle-container">
        <span class="toggle-label">Heavy Load / Cargo?</span>
        <label class="switch">
            <input type="checkbox" id="loadToggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="results">
        <div class="result-item">
            <span class="result-label">Battery %:</span>
            <span class="result-data" id="batteryPercent">100%</span>
        </div>
        <div class="result-item">
            <span class="result-label">Set Timer To:</span>
            <span class="result-data timer-highlight" id="timerValue">Ready</span>
        </div>
        <div class="result-item" style="flex-direction: column; align-items: flex-start; gap: 5px;">
            <span class="result-label">Est. Remaining Range:</span>
            <span class="result-data" id="rangeDistance">20 - 30 km</span>
        </div>
    </div>

    <div class="note">
        * Set your plug timer based on the green box above. Trust the timer and your charger's green light for safety!
    </div>
</div>

<script>
    const voltageInput = document.getElementById('voltageInput');
    const loadToggle = document.getElementById('loadToggle');
    const batteryPercentEl = document.getElementById('batteryPercent');
    const timerValueEl = document.getElementById('timerValue');
    const rangeDistanceEl = document.getElementById('rangeDistance');
    const batteryFill = document.getElementById('batteryFill');

    if(localStorage.getItem('ebike_voltage')) {
        voltageInput.value = localStorage.getItem('ebike_voltage');
    }
    if(localStorage.getItem('ebike_load') === 'true') {
        loadToggle.checked = true;
    }

    // Data: [Max Volts, Min Volts, Percent String, Est Percent Number, Hours Number]
    const voltData = [
        [70.00, 66.4, "100%", 100, 0], 
        [66.3, 66.0, "95%", 95, 3.5],
        [65.9, 65.3, "90%", 90, 4.0],
        [65.2, 64.6, "85%", 85, 4.0],
        [64.5, 63.9, "80%", 80, 4.5],
        [63.8, 63.1, "75%", 75, 4.5],
        [63.0, 62.4, "70%", 70, 5.0],
        [62.3, 61.7, "65%", 65, 5.5],
        [61.6, 61.0, "60%", 60, 5.5],
        [60.9, 60.3, "55%", 55, 6.0],
        [60.2, 59.6, "50%", 50, 6.5],
        [59.5, 58.9, "45%", 45, 6.5],
        [58.8, 58.2, "40%", 40, 7.0],
        [58.1, 57.4, "35%", 35, 7.5],
        [57.3, 56.7, "30%", 30, 7.5],
        [56.6, 56.0, "25%", 25, 8.0],
        [55.9, 55.3, "20%", 20, 8.5],
        [55.2, 54.6, "15%", 15, 9.0],
        [54.5, 53.9, "10%", 10, 9.5],
        [53.8, 53.2, "5%", 5, 10.0],
        [53.1, 50.0, "0%", 0, 10.0] 
    ];

    function calculateFromVolts() {
        let volts = parseFloat(voltageInput.value);
        let isHeavy = loadToggle.checked;

        localStorage.setItem('ebike_voltage', voltageInput.value);
        localStorage.setItem('ebike_load', isHeavy);

        if (isNaN(volts)) {
            resetDisplay();
            return;
        }

        let found = false;

        for (let row of voltData) {
            let maxV = row[0];
            let minV = row[1];
            let percentStr = row[2];
            let estPercent = row[3];
            let hoursNum = row[4];

            if (volts <= maxV && volts >= minV) {
                batteryPercentEl.innerText = percentStr;
                
                // Update Visual Battery
                batteryFill.style.width = estPercent + '%';
                if (estPercent > 50) {
                    batteryFill.style.backgroundColor = "var(--success)";
                } else if (estPercent > 20) {
                    batteryFill.style.backgroundColor = "var(--warning)";
                } else {
                    batteryFill.style.backgroundColor = "var(--danger)";
                }

                // Update Timer Value
                if (hoursNum === 0) {
                    timerValueEl.innerText = "Ready";
                } else {
                    // Format nicely (e.g., "6.5 Hrs")
                    timerValueEl.innerText = hoursNum + " Hrs";
                }

                // Update Range
                let minDistance, maxDistance;
                if (isHeavy) {
                    minDistance = (estPercent / 100) * 14; 
                    maxDistance = (estPercent / 100) * 21;
                } else {
                    minDistance = (estPercent / 100) * 20;
                    maxDistance = (estPercent / 100) * 30;
                }
                
                if (estPercent === 100) {
                    rangeDistanceEl.innerText = isHeavy ? "14 - 21 km" : "20 - 30 km";
                } else if (estPercent === 0) {
                     rangeDistanceEl.innerText = "Charge Now!";
                } else {
                    rangeDistanceEl.innerText = `${minDistance.toFixed(1)} - ${maxDistance.toFixed(1)} km`;
                }
                
                found = true;
                break;
            }
        }

        if (!found) {
            if (volts > 66.4) {
                batteryPercentEl.innerText = "100% (Surface)";
                timerValueEl.innerText = "Ready";
                batteryFill.style.width = "100%";
                batteryFill.style.backgroundColor = "var(--success)";
                rangeDistanceEl.innerText = isHeavy ? "14 - 21 km" : "20 - 30 km";
            } else if (volts < 50.0) {
                batteryPercentEl.innerText = "EMPTY";
                timerValueEl.innerText = "10+ Hrs";
                batteryFill.style.width = "0%";
                batteryFill.style.backgroundColor = "var(--danger)";
                rangeDistanceEl.innerText = "0 km";
            }
        }
    }

    function resetDisplay() {
        batteryPercentEl.innerText = "--";
        timerValueEl.innerText = "--";
        rangeDistanceEl.innerText = "--";
        batteryFill.style.width = "0%";
    }

    voltageInput.addEventListener('input', calculateFromVolts);
    loadToggle.addEventListener('change', calculateFromVolts);
    calculateFromVolts();
</script>

</body>
</html>
